<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#000"/>

  <!-- Animated Wave Lines -->
  <g stroke="#FFF" fill="none" stroke-width="1.5" opacity="0.2">
    <path d="M0,160 Q150,100 300,160 T600,160 T900,160 T1200,160">
      <animate attributeName="d" 
        values="M0,160 Q150,100 300,160 T600,160 T900,160 T1200,160;
                M0,160 Q150,220 300,160 T600,160 T900,160 T1200,160;
                M0,160 Q150,100 300,160 T600,160 T900,160 T1200,160" 
        dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="6s" repeatCount="indefinite"/>
    </path>
    
    <path d="M0,160 Q150,220 300,160 T600,160 T900,160 T1200,160" opacity="0.15">
      <animate attributeName="d" 
        values="M0,160 Q150,220 300,160 T600,160 T900,160 T1200,160;
                M0,160 Q150,100 300,160 T600,160 T900,160 T1200,160;
                M0,160 Q150,220 300,160 T600,160 T900,160 T1200,160" 
        dur="6s" repeatCount="indefinite" begin="1s"/>
    </path>

    <path d="M0,200 Q200,140 400,200 T800,200 T1200,200" opacity="0.1" stroke-width="1">
      <animate attributeName="d" 
        values="M0,200 Q200,140 400,200 T800,200 T1200,200;
                M0,200 Q200,260 400,200 T800,200 T1200,200;
                M0,200 Q200,140 400,200 T800,200 T1200,200" 
        dur="8s" repeatCount="indefinite" begin="0.5s"/>
    </path>

    <path d="M0,120 Q200,60 400,120 T800,120 T1200,120" opacity="0.1" stroke-width="1">
      <animate attributeName="d" 
        values="M0,120 Q200,60 400,120 T800,120 T1200,120;
                M0,120 Q200,180 400,120 T800,120 T1200,120;
                M0,120 Q200,60 400,120 T800,120 T1200,120" 
        dur="7s" repeatCount="indefinite" begin="1.5s"/>
    </path>
  </g>

  <!-- Floating Dots on Waves -->
  <g fill="#FFF">
    <circle cx="300" cy="160" r="2" opacity="0.6">
      <animate attributeName="cy" values="160;100;160" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="160" r="2" opacity="0.5">
      <animate attributeName="cy" values="160;220;160" dur="6s" repeatCount="indefinite" begin="2s"/>
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="6s" repeatCount="indefinite" begin="2s"/>
    </circle>
    <circle cx="900" cy="160" r="2" opacity="0.7">
      <animate attributeName="cy" values="160;100;160" dur="6s" repeatCount="indefinite" begin="4s"/>
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="6s" repeatCount="indefinite" begin="4s"/>
    </circle>
  </g>

  <!-- Center Text -->
  <text x="600" y="155" font-family="'Courier New', monospace" font-size="50" fill="#FFF" 
        text-anchor="middle" font-weight="bold" letter-spacing="10" filter="url(#glow)">
    SERAVIEL
  </text>
  
  <text x="600" y="190" font-family="'Courier New', monospace" font-size="14" fill="#888" 
        text-anchor="middle" letter-spacing="4">
    PIXEL JURASSIC DEVELOPER
  </text>

  <!-- Bottom Pulse Line -->
  <line x1="400" y1="240" x2="800" y2="240" stroke="#333" stroke-width="1">
    <animate attributeName="x1" values="400;500;400" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="800;700;800" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#333;#666;#333" dur="4s" repeatCount="indefinite"/>
  </line>
</svg>
