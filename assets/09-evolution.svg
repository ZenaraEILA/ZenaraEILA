<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
<rect width="1200" height="420" rx="26" fill="#060606"/>
<g font-family="monospace">
<text x="52" y="60" fill="#777" font-size="14">&gt; evolution.tree</text>
<text x="52" y="105" fill="#fff" font-size="30" font-weight="700">EVOLUTION PATH</text>
</g>
<g transform="translate(130 180)" font-family="monospace">
  <line x1="0" y1="0" x2="940" y2="0" stroke="#fff" stroke-opacity=".15" stroke-width="2"/>
  <g transform="translate(0 0)">
    <circle r="12" fill="#fff"/>
    <text y="48" text-anchor="middle" fill="#fff" font-size="14">HATCHED</text>
  </g>
  <g transform="translate(230 0)">
    <circle r="12" fill="#fff"/>
    <text y="48" text-anchor="middle" fill="#fff" font-size="14">NOVICE</text>
  </g>
  <g transform="translate(470 0)">
    <circle r="12" fill="#fff"/>
    <text y="48" text-anchor="middle" fill="#fff" font-size="14">DEVELOPER</text>
  </g>
  <g transform="translate(710 0)">
    <circle r="12" fill="#fff"/>
    <text y="48" text-anchor="middle" fill="#fff" font-size="14">ENGINEER</text>
  </g>
  <g transform="translate(940 0)">
    <circle r="12" fill="#202020" stroke="#fff" stroke-width="2"/>
    <text y="48" text-anchor="middle" fill="#fff" font-size="14">NEXT</text>
    <circle r="22" fill="none" stroke="#fff" stroke-opacity=".4"><animate attributeName="r" values="18;34;18" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0;.7" dur="1.8s" repeatCount="indefinite"/></circle>
  </g>
  <rect x="0" y="-3" width="0" height="6" rx="3" fill="#fff"><animate attributeName="width" values="0;710" dur="3s" fill="freeze"/></rect>
</g>
<text x="600" y="330" text-anchor="middle" fill="#6a6a6a" font-family="monospace" font-size="13">progress is not linear — keep moving anyway</text>
</svg>