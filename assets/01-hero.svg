<svg width="1200" height="460" viewBox="0 0 1200 460" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" x2="1">
    <stop offset="0%" stop-color="#000"/>
    <stop offset="50%" stop-color="#101010"/>
    <stop offset="100%" stop-color="#000"/>
  </linearGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
    <path d="M36 0H0V36" fill="none" stroke="#fff" stroke-opacity=".045"/>
  </pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="460" rx="28" fill="url(#bg)"/>
<rect width="1200" height="460" rx="28" fill="url(#grid)">
  <animateTransform attributeName="transform" type="translate" from="0 0" to="36 36" dur="8s" repeatCount="indefinite"/>
</rect>
<rect x="26" y="26" width="1148" height="408" rx="22" fill="none" stroke="#fff" stroke-opacity=".12"/>
<g font-family="monospace">
  <text x="64" y="68" fill="#6e6e6e" font-size="13" letter-spacing="3">PROFILE://SYSTEM/ONLINE</text>
  <circle cx="1080" cy="62" r="5" fill="#fff"><animate attributeName="opacity" values="1;.2;1" dur="1.2s" repeatCount="indefinite"/></circle>
  <text x="1096" y="67" fill="#8a8a8a" font-size="12">LIVE</text>

  <text x="600" y="155" text-anchor="middle" fill="#737373" font-size="15" letter-spacing="8">INITIALIZING DEVELOPER PROFILE</text>
  <text x="600" y="235" text-anchor="middle" fill="#fff" font-size="64" font-weight="700" letter-spacing="10" filter="url(#glow)">SERAVIEL</text>
  <text x="600" y="278" text-anchor="middle" fill="#b5b5b5" font-size="18" letter-spacing="3">SOFTWARE ENGINEER · WEB DEVELOPER · UI/UX</text>

  <text x="600" y="338" text-anchor="middle" fill="#6e6e6e" font-size="15">&gt; building digital systems with code + design</text>
  <rect x="818" y="322" width="9" height="20" fill="#fff">
    <animate attributeName="opacity" values="1;0;1" dur=".9s" repeatCount="indefinite"/>
  </rect>
</g>
<rect y="-8" width="1200" height="3" fill="#fff" opacity=".16">
  <animate attributeName="y" values="-10;470" dur="5s" repeatCount="indefinite"/>
</rect>
</svg>