<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <mask id="fade-mask">
      <rect x="0" y="0" width="1200" height="320" fill="url(#fade-grad)"/>
      <linearGradient id="fade-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#000"/>
        <stop offset="20%" stop-color="#FFF"/>
        <stop offset="80%" stop-color="#FFF"/>
        <stop offset="100%" stop-color="#000"/>
      </linearGradient>
    </mask>
  </defs>

  <rect width="100%" height="100%" fill="#000"/>

  <!-- Matrix Rain Columns -->
  <g font-family="monospace" font-size="14" fill="#FFF" opacity="0.15" mask="url(#fade-mask)">
    <text x="50" y="0">
      <tspan>10110</tspan>
      <animate attributeName="y" values="-100;420" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.4;0.15" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="120" y="0">
      <tspan>01001</tspan>
      <animate attributeName="y" values="-100;420" dur="5s" repeatCount="indefinite" begin="0.5s"/>
    </text>
    <text x="200" y="0">
      <tspan>11010</tspan>
      <animate attributeName="y" values="-100;420" dur="3.5s" repeatCount="indefinite" begin="1.2s"/>
    </text>
    <text x="320" y="0">
      <tspan>00101</tspan>
      <animate attributeName="y" values="-100;420" dur="6s" repeatCount="indefinite" begin="2s"/>
    </text>
    <text x="880" y="0">
      <tspan>10101</tspan>
      <animate attributeName="y" values="-100;420" dur="4.5s" repeatCount="indefinite" begin="0.8s"/>
    </text>
    <text x="980" y="0">
      <tspan>01110</tspan>
      <animate attributeName="y" values="-100;420" dur="5.5s" repeatCount="indefinite" begin="1.5s"/>
    </text>
    <text x="1080" y="0">
      <tspan>10011</tspan>
      <animate attributeName="y" values="-100;420" dur="3s" repeatCount="indefinite" begin="2.5s"/>
    </text>
    <text x="1150" y="0">
      <tspan>01010</tspan>
      <animate attributeName="y" values="-100;420" dur="4.2s" repeatCount="indefinite" begin="3s"/>
    </text>
  </g>

  <!-- Floating Symbols -->
  <g font-family="monospace" font-size="18" fill="#FFF" opacity="0.3" filter="url(#glow)">
    <text x="180" y="100">{ }</text>
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" repeatCount="indefinite"/>
    
    <text x="1020" y="200">&lt;/&gt;</text>
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="5s" repeatCount="indefinite" begin="1s"/>
    
    <text x="90" y="240">[ ]</text>
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3.5s" repeatCount="indefinite" begin="2s"/>
    
    <text x="1120" y="80">#</text>
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="6s" repeatCount="indefinite" begin="0.5s"/>
  </g>

  <!-- Center Content -->
  <text x="600" y="150" font-family="'Courier New', monospace" font-size="48" fill="#FFF" 
        text-anchor="middle" font-weight="bold" letter-spacing="10" filter="url(#glow)">
    SERAVIEL
  </text>
  
  <text x="600" y="185" font-family="'Courier New', monospace" font-size="13" fill="#666" 
        text-anchor="middle" letter-spacing="5">
    PIXEL JURASSIC DEVELOPER
  </text>

  <!-- Blinking Cursor -->
  <rect x="680" y="168" width="10" height="2" fill="#FFF">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Scan Line -->
  <rect x="0" y="0" width="1200" height="2" fill="#FFF" opacity="0.1">
    <animate attributeName="y" values="0;320;0" dur="8s" repeatCount="indefinite"/>
  </rect>
</svg>
